name: Build and Publish Docker Images

on:
  push:
    branches: # For testing. Remove when the PR is ready
      - '**'  # Triggers on every commit to any branch
    tags:
      - 'v*.*.*'  # Triggers on version tags like v1.0.0, v2.1.3, etc.
  workflow_dispatch:  # Allows manual triggering from any branch

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write  # Required for pushing to GitHub Container Registry
  id-token: write  # Required for artifact attestation
  attestations: write  # Required for artifact attestation

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - dockerfile: internal/examples/Dockerfile.agent
            image-name: opamp-agent-example
            context: .
          - dockerfile: internal/examples/Dockerfile.server
            image-name: opamp-server-example
            context: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image-name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Read Go version from internal/examples/go.mod
        id: go-version
        shell: bash
        run: |
          GO_VERSION="$(awk '$1=="go"{ split($2,v, "."); print v[1]"."v[2]; exit}' internal/examples/go.mod)"
          echo "version=${GO_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: "GO_VERSION=${{ steps.go-version.outputs.version }}"
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
