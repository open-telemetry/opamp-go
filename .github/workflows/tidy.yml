name: go-mod-tidy
on:
  # This job only ever runs for non-fork branches (see the `if` below), which
  # already receive a writable token under `pull_request`, so the elevated
  # `pull_request_target` context is unnecessary here.
  pull_request:
    types: [opened, ready_for_review, synchronize, reopened, labeled, unlabeled]
    branches:
      - main
permissions:
  contents: read
jobs:
  setup-environment:
    permissions:
      contents: write # to allow pushing changes to the branch
      pull-requests: write # to allow removing the renovatebot label
    runs-on: ubuntu-latest
    if: ${{ (github.event.pull_request.user.login == 'renovate[bot]' || contains(github.event.pull_request.labels.*.name, 'renovatebot')) && github.event.pull_request.head.repo.fork == false }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.head_ref }}
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Setup Go Environment
        run: |
          echo "GOPATH=$(go env GOPATH)" >> $GITHUB_ENV
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
      - name: Cache Go
        id: module-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /home/runner/go/pkg/mod
          key: go-pkg-mod-${{ runner.os }}-${{ hashFiles('**/go.mod', '**/go.sum') }}
      - name: Install dependencies
        if: steps.module-cache.outputs.cache-hit != 'true'
        run: make gomoddownload
      - name: Install Tools
        if: steps.module-cache.outputs.cache-hit != 'true'
        run: make install-tools
      - name: go mod tidy, make all
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          make tidy && make all
          git config user.name otelbot
          git config user.email 197425009+otelbot@users.noreply.github.com
          # The checkout does not persist credentials. Pass auth as a header so the
          # remote URL stays token-free, as actions/checkout itself does.
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git diff --exit-code || (git add . && git commit -m "go mod tidy, make all" && git -c "http.https://github.com/.extraheader=$AUTH_HEADER" push "https://github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_HEAD_REF}")
      - name: Remove renovatebot label
        if: ${{ contains(github.event.pull_request.labels.*.name, 'renovatebot') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr edit "$PR_NUMBER" --remove-label renovatebot
